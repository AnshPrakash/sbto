defaults:
  - task: g1/robot_object_ref
  - solver: cem
  - slurm: none
  - warm_start: incremental
  - data_processing: default
  - random: none
  - _self_

# Experiment name (will be root dir of the data)
exp_name: ""
# Description (as a suffix to rundir)
description: ""
# If a reference is provided, initial knots are taken from the reference
init_knots_from_ref: True
# Optional rollout export used only for the initial simulator state. The task
# continues to track task.cfg_ref.motion_path.
init_state_path: ""
# Optional best_trajectory.npz (or its run directory) used only for initial
# actuator knots; the task still tracks task.cfg_ref.motion_path.
init_control_path: ""
# Bounds for per-knot control standard deviations estimated from policy rollout
# candidates. Ignored by ordinary SBTO trajectory warm starts.
init_control_std_floor: 0.02
init_control_std_ceiling: 0.25
